plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // Android 9 (API 28) 及以上的 Android TV 盒子适配：
        // 这里固定写死为 24（Android 7.0），不再使用 flutter.minSdkVersion。
        // 原因：flutter.minSdkVersion 会随着 Flutter 版本升级而不断抬高
        // （历史上是 16 -> 19 -> 21 -> 24），一旦上游 Flutter 版本继续提高，
        // 老盒子就会被静默淘汰。写死 24 可以同时覆盖 Android 7 / 8 / 9 / 10+，
        // 也保证后续升级 Flutter 时不会再动到最低兼容版本。
        // 已确认本项目的所有插件都支持 minSdk 24（官方发布 APK 的 minSdkVersion 即为 24）。
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // 固定签名，保证后续版本可以直接覆盖安装升级。
    // 之前用 signingConfigs.debug：CI 每次运行都会生成全新的 debug keystore，
    // 导致两次构建的签名不同，安装时报
    // INSTALL_FAILED_UPDATE_INCOMPATIBLE，必须先卸载（连带清掉所有设置和观看记录）。
    // 这里改用仓库内置的 keystore；如果文件不存在（例如上游拉取后未带该文件），
    // 仍然退回 debug 签名，不影响正常编译。
    def releaseKeystore = file('../keystore/kazumi-tv-release.jks')
    def hasReleaseKeystore = releaseKeystore.exists()

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystore
                storePassword 'kazumi-tv-2026'
                keyAlias 'kazumi-tv'
                keyPassword 'kazumi-tv-2026'
            }
        }
    }

    buildTypes {
        release {
            // 括号不能省：Groovy 不会把换行后的三元表达式续接到上一行的方法调用上
            signingConfig(hasReleaseKeystore
                    ? signingConfigs.release
                    : signingConfigs.debug)
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
